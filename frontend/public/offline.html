<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PropertyYield AI · Offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(60% 50% at 20% 10%, rgb(99 102 241 / .25), transparent 70%),
                radial-gradient(50% 40% at 90% 90%, rgb(6 182 212 / .18), transparent 70%), #0b0e17;
    color: #e6e9f2; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center;
  }
  .card { max-width: 380px; padding: 32px 24px; border-radius: 20px; background: rgb(255 255 255 / .05); border: 1px solid rgb(255 255 255 / .1); backdrop-filter: blur(16px); }
  .mark { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, #6366f1, #06b6d4); box-shadow: 0 10px 30px -10px rgb(99 102 241 / .9); }
  h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.3; }
  p { margin: 0 0 24px; color: #9aa3b8; font-size: 15px; }
  button { appearance: none; border: 0; border-radius: 10px; padding: 12px 22px; font: 600 15px/1 inherit; color: #fff; background: linear-gradient(135deg, #6366f1, #06b6d4); cursor: pointer; }
  button:active { transform: scale(.98); }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22l6-6 4 4 9-9"/><path d="M19 11h6v6"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>PropertyYield needs a connection to load listings and rents. Check your connection and try again. The server can also take up to a minute to wake up.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
